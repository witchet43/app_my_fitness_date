name: Lockfile export temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock in isolated runner
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export lockfile to restricted public CI log
        run: |
          echo MFD_LOCK_BEGIN
          base64 -w0 package-lock.json | fold -w 180 | sed 's/^/MFD_LOCK:/'
          echo MFD_LOCK_END
          sha256sum package-lock.json
