name: Flutter and microservices V22

# Budget-controlled manual-only workflow; no automatic PR/push builds.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  python-services:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api_gateway, gym_shield]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      - name: Install service and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Contract and privacy unit tests
        run: python -m pytest -q tests

  flutter:
    name: Flutter analyze, test, web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate uncommitted platform runners for QA
        run: flutter create . --project-name my_fitness_date --platforms=web,android,ios
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos
      - name: Test Flutter
        run: flutter test
      - name: Build Web DEV (not deploy)
        run: flutter build web --release --dart-define=MFD_API_BASE_URL=
      - name: Verify hosted Google and email authentication
        run: python3 ../../scripts/verify_hosted_auth.py
      - name: Smoke hosted member API (deny anonymous)
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-v26"
          headers={"User-Agent":"MyFitnessDate-CI-Smoke/1.0"}
          def probe(path):
              request=urllib.request.Request(base+path,headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=15) as r:
                      return r.status,r.read().decode("utf8")
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf8")
          status,body=probe("/healthz")
          assert status==200,(status,body[:150])
          assert json.loads(body).get("status")=="ok"
          for path in ("/v1/me/profile","/v1/dating/candidates"):
              status,_=probe(path)
              assert status==401,(path,status)
          print("Member API healthy; anonymous profile and dating blocked.")
          PY
