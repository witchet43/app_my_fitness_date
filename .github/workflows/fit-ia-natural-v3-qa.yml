name: Fit-IA Natural Conversation QA
on:
  push:
    branches: [feature/fit-ia-natural-guided-chat-v3-20261117]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Privacy and architectural gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('supabase/migrations/202611170047_fit_ia_natural_chat_v3.sql').read_text()
          assert 'fit_ia_chat_user_v3' in sql and 'fit_ia_chat_agent_v3' in sql
          assert 'client_key' in sql and 'fit_ia_messages_v1' in sql
          assert "m.meaningful" in sql
          edge=Path('supabase/functions/fit-ia-v1/index.ts').read_text()
          assert 'STRICT IMMUTABLE DOMAIN:' in edge
          assert 'quick_options' in edge and 'meaningful' in edge
          assert 'safeForModel' in edge and 'ai_unavailable' in edge
          page=Path('apps/flutter_client/lib/src/features/fit_ia_natural_chat_page.dart').read_text()
          assert 'fit-ia-message-input' in page
          assert 'fit-ia-quick-option-' in page
          assert 'fit-ia-executive-summary' in page
          assert 'FitIaMascot' in page
          assert "fitIaChatSend" in page
          assert "Formulario" not in page
          member=Path('apps/flutter_client/lib/src/features/member_profile_v26.dart').read_text()
          assert 'FitIaNaturalChatPage(' in member
          print('Natural chat, privacy and owner-only persistence gate PASS')
          PY
          python3 scripts/check_public_legal.py
          node scripts/test_fitted_legal_brand.cjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare Flutter
        working-directory: apps/flutter_client
        run: |
          flutter create --platforms=web . --project-name=my_fitness_date
          flutter pub get
      - name: Analyze Flutter
        working-directory: apps/flutter_client
        run: flutter analyze --no-fatal-infos
      - name: Entire Flutter regression suite
        working-directory: apps/flutter_client
        run: flutter test --reporter expanded
      - name: Compile production web application
        working-directory: apps/flutter_client
        run: flutter build web --release --dart-define=MFD_V26_ENABLED=true
