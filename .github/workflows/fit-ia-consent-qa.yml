name: Fit-IA consent and assistant branding QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/flutter_client/**'
      - 'supabase/migrations/**'
      - '.github/workflows/fit-ia-consent-qa.yml'
permissions:
  contents: read
concurrency:
  group: fit-ia-consent-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare Flutter
        working-directory: apps/flutter_client
        run: |
          flutter create --platforms=web . --project-name=my_fitness_date
          flutter pub get
      - name: Flutter analyze and test
        working-directory: apps/flutter_client
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Compile web release
        working-directory: apps/flutter_client
        run: flutter build web --release
