name: My Fitness Date — hosted member API smoke

on:
  pull_request:
    paths:
      - "supabase/functions/member-api-v26/**"
      - "scripts/member-api-config.test.ts"
      - ".github/workflows/member-api-live-smoke.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/member-api-v26/**"
      - ".github/workflows/member-api-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Healthy backend and anonymous requests denied
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify hosted key resolution and anonymous isolation
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-v26"
          headers={"User-Agent":"MyFitnessDate-HostedSmoke/1.0",
                   "Origin":"https://my-fitness-date.pages.dev"}
          def probe(path):
              req=urllib.request.Request(base+path,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,r.read(800).decode("utf8"),r.headers
              except urllib.error.HTTPError as e:
                  return e.code,e.read(800).decode("utf8"),e.headers
          status,body,headers=probe("/healthz")
          assert status==200,(status,body[:200])
          result=json.loads(body)
          assert result["status"]=="ok" and result["service"]=="member-api-v26"
          assert headers.get("Access-Control-Allow-Origin")=="https://my-fitness-date.pages.dev"
          for path in ("/v1/me/profile","/v1/me/consents","/v1/dating/candidates"):
              status,body,_=probe(path)
              assert status==401,(path,status,body[:150])
          print("PASS: production backend is connected; private endpoints reject anonymous traffic")
          PY
