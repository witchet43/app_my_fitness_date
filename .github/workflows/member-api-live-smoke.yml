name: My Fitness Date — hosted member API smoke

on:
  pull_request:
    paths:
      - "supabase/functions/member-api-v26/**"
      - "scripts/member-api-config.test.ts"
      - ".github/workflows/member-api-live-smoke.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/member-api-v26/**"
      - ".github/workflows/member-api-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Backend, preflight and anonymous access controls
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify real production health and Flutter browser CORS
        shell: bash
        run: |
          set -euo pipefail
          base="https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-v26"
          opts=(--silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 6 --max-time 20)
          agent="MyFitnessDate-HostedSmoke/1.1"
          origin="https://my-fitness-date.pages.dev"
          code=$(curl "${opts[@]}" -H "User-Agent: $agent" -H "Origin: $origin" \
              -D /tmp/mfd-headers.txt -o /tmp/mfd-response.json -w '%{http_code}' "$base/healthz")
          test "$code" = "200"
          python3 -c 'import json; j=json.load(open("/tmp/mfd-response.json")); assert j["status"]=="ok" and j["service"]=="member-api-v26"'
          grep -Eiq '^access-control-allow-origin: https://my-fitness-date.pages.dev' /tmp/mfd-headers.txt

          code=$(curl "${opts[@]}" -X OPTIONS \
              -H "User-Agent: $agent" -H "Origin: $origin" \
              -H "Access-Control-Request-Method: GET" \
              -H "Access-Control-Request-Headers: authorization,cache-control,content-type" \
              -D /tmp/mfd-preflight.txt -o /dev/null -w '%{http_code}' "$base/v1/me/consents")
          test "$code" = "204"
          grep -Eiq '^access-control-allow-headers:.*cache-control' /tmp/mfd-preflight.txt
          grep -Eiq '^access-control-allow-origin: https://my-fitness-date.pages.dev' /tmp/mfd-preflight.txt

          for route in /v1/me/profile /v1/me/consents /v1/dating/candidates; do
            code=$(curl "${opts[@]}" -H "User-Agent: $agent" -H "Origin: $origin" \
                -o /dev/null -w '%{http_code}' "$base$route")
            test "$code" = "401"
          done
          echo "PASS: Edge healthy, browser CORS preflight authorizes Cache-Control, anonymous access denied"
