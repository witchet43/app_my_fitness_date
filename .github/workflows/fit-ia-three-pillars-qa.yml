name: Fit-IA three pillar chat QA
on:
  push:
    branches: [feature/fitted-fit-ia-chat-three-pillars-20261116]
    paths: [.build-gates/fit-ia-qa.txt]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check question banks, privacy and no replacement of approved cover
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('supabase/migrations')
          for n,prefix in [('041','move'),('042','live'),('043','relate')]:
              match=next(base.glob('2026111700'+n[-2:]+'*'),None)
              assert match, (n,prefix)
              sql=match.read_text()
              ids=re.findall(r"\('("+prefix+r"_[0-9]{3})'",sql)
              assert len(ids)==100 and len(set(ids))==100,(prefix,len(ids))
          schema=(base/'202611170040_fit_ia_conversation_schema.sql').read_text()
          for name in ['fit_ia_answers_v1','fit_ia_sessions_v1',
                       'fit_ia_messages_v1','fit_ia_summaries_v1']:
              assert 'alter table public.'+name+' enable row level security' in schema
          assert 'p_choice_key' in schema and 'auth.uid()' in schema
          src=Path('apps/flutter_client/lib/src/features/member_profile_v26.dart').read_text()
          assert 'FitIaConversationPage' in src
          assert 'RhythmConceptLabB10(' not in src
          code=Path('supabase/functions/fit-ia-v1/index.ts').read_text()
          assert 'OPENAI_API_KEY' in code and 'fit_ia_summary_context_v1' in code
          assert 'consent_required' in code
          print('300 questions + private RLS + adaptive Fit-IA routes PASS')
          PY
          python3 scripts/check_public_legal.py
          node scripts/test_fitted_legal_brand.cjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare Flutter
        working-directory: apps/flutter_client
        run: |
          flutter create --platforms=web . --project-name=my_fitness_date
          flutter pub get
      - name: Analyze Flutter
        working-directory: apps/flutter_client
        run: flutter analyze --no-fatal-infos
      - name: Full widget and regression suite
        working-directory: apps/flutter_client
        run: flutter test --reporter expanded
      - name: Compile release website
        working-directory: apps/flutter_client
        run: flutter build web --release --dart-define=MFD_V26_ENABLED=true
