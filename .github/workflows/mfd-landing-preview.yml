name: My Fitness Date - landing redesign preview
# Release candidate: B11 editorial marketing only; does not change production.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mfd-landing-preview.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mfd-landing-redesign-preview
  cancel-in-progress: false
jobs:
  landing-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/b11-one-final-real-product-20261112
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Generate web runner
        working-directory: apps/flutter_client
        run: flutter create --platforms=web . --project-name=my_fitness_date
      - name: Fetch dependencies
        working-directory: apps/flutter_client
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: apps/flutter_client
        run: flutter analyze --no-fatal-infos
      - name: Test landing, brand and sign-in gates
        working-directory: apps/flutter_client
        run: |
          flutter test test/landing_welcome_editorial_test.dart test/public_entry_test.dart test/live_brand_b3_test.dart test/email_sign_in_flow_test.dart
      - name: Check hosted Auth provider configuration
        run: |
          python3 scripts/verify_hosted_auth.py
          python3 - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          workflow=Path('.github/workflows/cloudflare-pages-production.yml').read_text()
          match=re.search(r'MFD_PROD_SUPABASE_PUBLISHABLE_KEY=(sb_publishable_[A-Za-z0-9_-]+)',workflow)
          assert match, 'Missing public publishable key'
          url='https://jtrdvnwbxpfdnbzasvcj.supabase.co/auth/v1/settings'
          req=urllib.request.Request(url,headers={'apikey':match.group(1),'User-Agent':'MFD-preview-auth-check/1.0'})
          with urllib.request.urlopen(req,timeout=20) as response:
              cfg=json.load(response)
          providers=cfg.get('external',{})
          assert providers.get('email') is True, 'Email login unavailable'
          assert providers.get('google') is True, 'Google provider unavailable'
          apple=providers.get('apple') is True
          with open(__import__('os').environ['GITHUB_ENV'],'a') as env:
              env.write('MFD_APPLE_AVAILABLE='+str(apple).lower()+'\n')
          print('Google and email available; Apple provider configured:',apple)
          PY
      - name: Compile authenticated Flutter web preview
        working-directory: apps/flutter_client
        run: |
          flutter build web --release \
            --dart-define=MFD_V26_ENABLED=true \
            --dart-define=MFD_GOOGLE_PROVIDER_VERIFIED=true \
            --dart-define=MFD_APPLE_PROVIDER_VERIFIED="$MFD_APPLE_AVAILABLE" \
            --dart-define=MFD_PROD_SUPABASE_URL=https://jtrdvnwbxpfdnbzasvcj.supabase.co \
            --dart-define=MFD_PROD_SUPABASE_PUBLISHABLE_KEY=sb_publishable_IAPJ1C1EdLg155iMOgRNfg_i6OWuJkk \
            --dart-define=MFD_API_BASE_URL=https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-v26 \
            --dart-define=MFD_TERMS_URL=https://landing-redesign.my-fitness-date.pages.dev/terms/ \
            --dart-define=MFD_PRIVACY_URL=https://landing-redesign.my-fitness-date.pages.dev/privacy/ \
            --dart-define=MFD_TERMS_VERSION=v27-terms-1 \
            --dart-define=MFD_PRIVACY_VERSION=v27-privacy-1 \
            --dart-define=MFD_OAUTH_REDIRECT_URL=https://landing-redesign.my-fitness-date.pages.dev/
          cp cloudflare/_headers build/web/_headers
          cp cloudflare/_redirects build/web/_redirects
          cp -R cloudflare/terms cloudflare/privacy build/web/
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          Path('build/web/mfd-release.json').write_text(json.dumps({
            'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'channel':'landing_redesign_preview',
            'member_access':True,
            'dating_enabled':False
          })+'\n')
          PY
      - name: Check Cloudflare token available
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          fi
      - name: Deploy preview only, never production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d10780918aa05ee5532c754371c60c94
          command: pages deploy apps/flutter_client/build/web --project-name=my-fitness-date --branch=landing-redesign
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: End-to-end public Cloudflare smoke and deployed SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time,urllib.request
          target='https://landing-redesign.my-fitness-date.pages.dev'
          expected=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          def read(path):
              req=urllib.request.Request(target+path,headers={
                  'User-Agent':'MyFitnessDate-LandingSmoke/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  assert response.status==200
                  return response.read().decode('utf-8')
          for attempt in range(10):
              try:
                  data=json.loads(read('/mfd-release.json?verify='+expected))
                  assert data['commit']==expected,(data,expected)
                  assert data['channel']=='landing_redesign_preview'
                  assert data['member_access'] is False
                  assert data['dating_enabled'] is False
                  assert '<html' in read('/').lower()
                  for page in ('terms','privacy'):
                      assert '<html' in read('/'+page+'/').lower()
                  print('DEPLOYED_AND_VERIFIED:',target,'SHA:',expected)
                  break
              except Exception as e:
                  if attempt==9: raise
                  time.sleep(6)
          PY
