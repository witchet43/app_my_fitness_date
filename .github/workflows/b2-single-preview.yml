# Exactly ONE remote job for B2. Triggered by a one-time marker commit.
# Builds, tests and deploys QA PREVIEW. NEVER updates Cloudflare main/production.
name: MFD B2 — single QA build and Cloudflare preview
on:
  push:
    branches:
      - feature/b2-member-activities-lifecycle-20261112
    paths:
      - .build-gates/b2-validation-request.txt

permissions:
  contents: read
  deployments: write

concurrency:
  group: mfd-b2-preview-single-job
  cancel-in-progress: false

jobs:
  b2:
    name: B2 consolidated quality gate + isolated preview publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Node dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript, API, domain and offline security checks
        run: |
          set -euo pipefail
          npm run typecheck
          npm test
          python3 scripts/check_b1_static.py
          python3 scripts/check_b2_static.py
          python3 scripts/check_public_legal.py

      - name: Verify separate hosted B2 QA API (no member credentials)
        run: |
          set -euo pipefail
          base='https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-b2-preview'
          curl -fsS --retry 3 --max-time 25 "$base/healthz" > /tmp/b2-healthz.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/b2-healthz.json'))
          assert d.get('status')=='ok' and d.get('service')=='member-api-v26'
          PY
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            --max-time 25 "$base/v1/me/activities")
          test "$status" = 401
          curl -fsS -D /tmp/b2-cors.txt -o /dev/null --max-time 25 \
            -X OPTIONS -H 'Origin: https://b2-preview.my-fitness-date.pages.dev' \
            -H 'Access-Control-Request-Method: GET' "$base/v1/me/activities"
          grep -qi 'access-control-allow-origin: https://b2-preview.my-fitness-date.pages.dev' /tmp/b2-cors.txt

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Create Flutter web runner and fetch dependencies
        working-directory: apps/flutter_client
        run: |
          set -euo pipefail
          flutter create --platforms=web . --project-name=my_fitness_date
          flutter pub get

      - name: Flutter analyze + ALL widget and unit tests
        working-directory: apps/flutter_client
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

      - name: Compile actual authenticated Flutter web app for QA preview
        working-directory: apps/flutter_client
        run: |
          set -euo pipefail
          flutter build web --release \
            --dart-define=MFD_V26_ENABLED=true \
            --dart-define=MFD_PUBLIC_PRODUCTION=false \
            --dart-define=MFD_GOOGLE_PROVIDER_VERIFIED=false \
            --dart-define=MFD_PROD_SUPABASE_URL=https://jtrdvnwbxpfdnbzasvcj.supabase.co \
            --dart-define=MFD_PROD_SUPABASE_PUBLISHABLE_KEY=sb_publishable_IAPJ1C1EdLg155iMOgRNfg_i6OWuJkk \
            --dart-define=MFD_API_BASE_URL=https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-b2-preview \
            --dart-define=MFD_TERMS_URL=https://my-fitness-date.pages.dev/terms/ \
            --dart-define=MFD_PRIVACY_URL=https://my-fitness-date.pages.dev/privacy/ \
            --dart-define=MFD_TERMS_VERSION=v27-terms-1 \
            --dart-define=MFD_PRIVACY_VERSION=v27-privacy-1 \
            --dart-define=MFD_OAUTH_REDIRECT_URL=https://my-fitness-date.pages.dev/
          test -s build/web/index.html
          cp cloudflare/_headers build/web/_headers
          cp cloudflare/_redirects build/web/_redirects
          cp -R cloudflare/privacy cloudflare/terms cloudflare/brand-lab build/web/
          mkdir -p build/web/admin/branding/reset-password
          cp cloudflare/admin/branding/admin-brand.css build/web/admin/branding/
          cp cloudflare/admin/branding/reset-password/index.html \
            cloudflare/admin/branding/reset-password/reset-password.js \
            build/web/admin/branding/reset-password/
          python3 - <<'PY'
          import os,json,pathlib
          pathlib.Path('build/web/mfd-release.json').write_text(json.dumps({
            'commit': os.environ['GITHUB_SHA'],
            'channel': 'b2_private_qa_preview',
            'build_units_since_plan_start': 2,
            'production': False
          })+'\n')
          PY

      - name: Upload immutable QA web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfd-b2-preview-flutter-web
          path: apps/flutter_client/build/web/
          retention-days: 7
          if-no-files-found: error

      - name: Ensure Cloudflare credentials exist
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret."
            exit 1
          fi

      - name: Publish QA branch only — NOT production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d10780918aa05ee5532c754371c60c94
          command: pages deploy apps/flutter_client/build/web --project-name=my-fitness-date --branch=b2-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact preview SHA and HTTP response
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          url='https://b2-preview.my-fitness-date.pages.dev/mfd-release.json'
          expected=os.environ['EXPECTED_SHA']
          last=None
          for attempt in range(12):
            try:
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=12) as response:
                body=json.loads(response.read())
                if body.get('commit')==expected and body.get('production') is False:
                  print('B2 preview published and exact source SHA verified:',expected)
                  break
                last=body
            except Exception as exc:
              last=str(exc)
            time.sleep(5)
          else:
            raise SystemExit('QA preview not verified: '+str(last)[:160])
          PY
