name: Fitted silver compact landing - temporary QA
on:
  push:
    branches: [feature/fitted-silver-logo-compact-access-20261116]
    paths:
      - .build-gates/fitted-silver-compact-request.txt
permissions:
  contents: read
jobs:
  flutter-silver-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Prepare Flutter web
        working-directory: apps/flutter_client
        run: |
          flutter create --platforms=web . --project-name=my_fitness_date
          flutter pub get
      - name: Validate generated silver web and native-safe icon assets
        run: |
          python3 -m venv .fitted-brand-venv
          .fitted-brand-venv/bin/python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
          .fitted-brand-venv/bin/python scripts/build_fitted_brand_assets.py --project apps/flutter_client
          .fitted-brand-venv/bin/python scripts/check_fitted_brand_assets.py --project apps/flutter_client
      - name: Exact approved image and scoped design assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('apps/flutter_client')
          image=root/'assets/branding/fitted_approved_cover_reference.png'
          assert hashlib.sha256(image.read_bytes()).hexdigest()=='58cec73adf728f2bcaef85626a3b49dd381db4bb102028e50b0cc58567113107'
          landing=(root/'lib/src/features/public_entry_shell.dart').read_text()
          mark=(root/'lib/src/widgets/mfd_branding.dart').read_text()
          assert 'height:heroHeight' not in landing
          assert 'child:_message(brand,scale,true)' in landing
          assert 'Color(0xE8F2F6F7)' in mark and 'Color(0xA67D929D)' in mark
          print('Exact approved couple and compact silver marks: PASS')
          PY
      - name: Flutter analyzer and regression suite
        working-directory: apps/flutter_client
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Flutter Web release compilation
        working-directory: apps/flutter_client
        run: flutter build web --release --dart-define=MFD_V26_ENABLED=true
