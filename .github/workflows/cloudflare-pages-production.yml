name: My Fitness Date — Cloudflare Pages production
on:
  push:
    branches: [main]
    paths:
      - "apps/flutter_client/**"
      - "release/public_web_manifest.json"
      - ".github/workflows/cloudflare-pages-production.yml"
      - "cloudbuild.yaml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: mfd-cloudflare-pages-production
  cancel-in-progress: false

jobs:
  production:
    name: Public Flutter build, QA and Cloudflare Pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require production main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Only main can deploy to production."
          exit 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Create Flutter Web runner
        working-directory: apps/flutter_client
        run: flutter create --platforms=web . --project-name=my_fitness_date
      - name: Resolve Flutter dependencies
        working-directory: apps/flutter_client
        run: flutter pub get
      - name: Validate member V27 release manifest
        run: |
          python3 scripts/check_saas_factory.py
          python3 scripts/check_public_legal.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("release/public_web_manifest.json").read_text())
          assert m["channel"]=="member_profile_v27"
          assert m["requires_authentication"] is True
          assert m["network_backend_enabled"] is True
          assert "email_registration" in m["enabled_features"]
          assert "fitdating_consent_and_eligibility" in m["enabled_features"]
          assert "unverified_dating_discovery" in m["disabled_features"]
          assert "public_media_upload" in m["disabled_features"]
          PY
      - name: Validate Brand Lab HTML/JS before building
        run: |
          python3 scripts/test_brand_lab_static.py
          node --check apps/flutter_client/cloudflare/brand-lab/brand-lab.js
          node scripts/test_brand_lab_runtime.cjs
          python3 scripts/test_brand_admin_static.py
          node --check apps/flutter_client/cloudflare/admin/branding/admin-brand.js
          node --check apps/flutter_client/cloudflare/admin/branding/reset-password/reset-password.js
      - name: Verify hosted Google and email authentication
        run: python3 scripts/verify_hosted_auth.py
      - name: Verify hosted member API before exposing registration
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          base="https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-v26"
          headers={"User-Agent":"MyFitnessDate-ReleaseSmoke/1.0"}
          def probe(path):
              req=urllib.request.Request(base+path,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                      return r.status,r.read().decode("utf-8")
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf-8")
          status,payload=probe("/healthz")
          assert status==200,(status,payload[:200])
          data=json.loads(payload)
          assert data["status"]=="ok" and data["service"]=="member-api-v26"
          for resource in ("/v1/me/profile","/v1/dating/candidates"):
              status,_=probe(resource)
              assert status==401,(resource,status)
          print("Hosted member API: healthy; unauthorized profiles/dating denied")
          PY
      - name: Analyze Flutter
        working-directory: apps/flutter_client
        run: flutter analyze --no-fatal-infos
      - name: Test Flutter
        working-directory: apps/flutter_client
        run: flutter test
      - name: Build production Flutter Web (identity and owner-only API)
        working-directory: apps/flutter_client
        run: |
          flutter build web --release \
            --dart-define=MFD_PUBLIC_PRODUCTION=true \
            --dart-define=MFD_QA_LOGIN_UI=false \
            --dart-define=MFD_V26_ENABLED=true \
            --dart-define=MFD_GOOGLE_PROVIDER_VERIFIED=true \
            --dart-define=MFD_PROD_SUPABASE_URL=https://jtrdvnwbxpfdnbzasvcj.supabase.co \
            --dart-define=MFD_PROD_SUPABASE_PUBLISHABLE_KEY=sb_publishable_IAPJ1C1EdLg155iMOgRNfg_i6OWuJkk \
            --dart-define=MFD_API_BASE_URL=https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/member-api-v26 \
            --dart-define=MFD_TERMS_URL=https://my-fitness-date.pages.dev/terms/ \
            --dart-define=MFD_PRIVACY_URL=https://my-fitness-date.pages.dev/privacy/ \
            --dart-define=MFD_TERMS_VERSION=v27-terms-1 \
            --dart-define=MFD_PRIVACY_VERSION=v27-privacy-1 \
            --dart-define=MFD_OAUTH_REDIRECT_URL=https://my-fitness-date.pages.dev/
          test -s build/web/index.html
          cp cloudflare/_headers build/web/_headers
          cp cloudflare/_redirects build/web/_redirects
          cp -R cloudflare/privacy cloudflare/terms cloudflare/brand-lab build/web/
          mkdir -p build/web/admin/branding/reset-password
          cp cloudflare/admin/branding/admin-brand.css build/web/admin/branding/
          cp cloudflare/admin/branding/reset-password/index.html cloudflare/admin/branding/reset-password/reset-password.js build/web/admin/branding/reset-password/
          test -s build/web/privacy/index.html
          test -s build/web/terms/index.html
          test -s build/web/brand-lab/index.html
          test -s build/web/brand-lab/brand-lab.css
          test -s build/web/brand-lab/brand-lab.js
          test -s build/web/admin/branding/admin-brand.css
          test ! -e build/web/admin/branding/index.html
          test ! -e build/web/admin/branding/admin-brand.js
          test -s build/web/admin/branding/reset-password/index.html
          test -s build/web/admin/branding/reset-password/reset-password.js
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          sha=os.environ["GITHUB_SHA"]
          assert len(sha)==40
          Path("build/web/mfd-release.json").write_text(
            json.dumps({"commit":sha,"channel":"member_profile_v27","version":"v27"})+"\n")
          PY
      - name: Keep public web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mfd-cloudflare-public-web
          path: apps/flutter_client/build/web/
          retention-days: 7
          if-no-files-found: error
      - name: Require Cloudflare Pages repository token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN in THIS repository Actions secrets. Shared MUV GitHub secrets are not inherited."
            exit 1
          fi
      - name: Deploy public app to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d10780918aa05ee5532c754371c60c94
          command: pages deploy apps/flutter_client/build/web --project-name=my-fitness-date --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify live HTTP and exact release commit
        env:
          MFD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          sha=os.environ["MFD_SHA"]
          url="https://my-fitness-date.pages.dev/mfd-release.json"
          # Cloudflare Pages Browser Integrity Check rejects Python urllib default User-Agent (HTTP 403/1010).
          # Use an identified, descriptive CI client without reducing site protection.
          def open_public(url):
              request=urllib.request.Request(url,headers={"User-Agent":"MyFitnessDate-ReleaseSmoke/1.0 (+https://my-fitness-date.pages.dev/)"})
              return urllib.request.urlopen(request,timeout=12)
          for attempt in range(7):
              try:
                  with open_public(url+"?v="+sha) as r:
                      release=json.load(r)
                  with open_public("https://my-fitness-date.pages.dev/") as r:
                      index=r.read().decode("utf8")
                  assert release=={"commit":sha,"channel":"member_profile_v27","version":"v27"}
                  assert "flutter" in index.lower()
                  for slug in ("privacy", "terms"):
                      with open_public("https://my-fitness-date.pages.dev/"+slug+"/?v="+sha) as r:
                          legal=r.read().decode("utf8")
                      assert "<!doctype html>" in legal.lower() and "witchet43@gmail.com" in legal
                  with open_public("https://my-fitness-date.pages.dev/brand-lab/?v="+sha) as r:
                      lab=r.read().decode("utf8")
                      assert r.status==200
                  assert "Brand Lab" in lab and "brand-lab.js" in lab and "Diez propuestas" in lab
                  for asset_name in ("brand-lab.js","brand-lab.css"):
                      with open_public("https://my-fitness-date.pages.dev/brand-lab/"+asset_name+"?v="+sha) as r:
                          asset=r.read().decode("utf8")
                          assert r.status==200 and len(asset)>1000
                  # The OLD standalone admin page must NOT be served. The
                  # admin must use the SAME Flutter app and shared login.
                  with open_public("https://my-fitness-date.pages.dev/admin/branding/?v="+sha) as r:
                      integrated=r.read().decode("utf8")
                      assert r.status==200
                  assert "flutter" in integrated.lower() and "admin-brand.js" not in integrated
                  with open_public("https://my-fitness-date.pages.dev/admin/branding/admin-brand.css?v="+sha) as r:
                      legacy_reset_css=r.read().decode("utf8")
                      assert r.status==200 and len(legacy_reset_css)>1000
                  with open_public("https://my-fitness-date.pages.dev/admin/branding/reset-password/?v="+sha) as r:
                      reset=r.read().decode("utf8")
                      assert r.status==200
                  assert "Crear tu contraseña" in reset and "reset-password.js" in reset
                  with open_public("https://my-fitness-date.pages.dev/admin/branding/reset-password/reset-password.js?v="+sha) as r:
                      reset_js=r.read().decode("utf8")
                      assert r.status==200 and "brand_admin_status" in reset_js and "history.replaceState" in reset_js
                  print("PUBLIC CLOUDFLARE RELEASE + ADMIN PASSWORD RECOVERY VERIFIED:",sha)
                  break
              except Exception as error:
                  if attempt==6:
                      raise RuntimeError("Cloudflare production commit smoke failed") from error
                  time.sleep(5)
          PY
