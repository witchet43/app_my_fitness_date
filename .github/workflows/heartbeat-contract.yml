name: SaaS heartbeat contract

on:
  pull_request:
    paths:
      - 'supabase/functions/heartbeat/**'
      - 'supabase/tests/saas_heartbeat_test.sql'
      - 'supabase/migrations/202611090013_saas_heartbeat.sql'
      - 'supabase/config.toml'
      - '.github/workflows/heartbeat-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heartbeat-db-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heartbeat_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d heartbeat_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: heartbeat_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Verify read-only RPC and least-privilege grants
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202611090013_saas_heartbeat.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saas_heartbeat_test.sql
