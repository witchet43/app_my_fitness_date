name: Fitted Brand Studio 50 palettes + 20 logos QA
on:
  push:
    branches: [feature/fitted-brand-studio-50-palettes-20-logos-20261116]
    paths:
      - .build-gates/fitted-brand-studio-qa.txt
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify migrations and 21 catalog options
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('supabase/migrations/202611160038_brand_studio_palette_logo_catalog.sql').read_text()
          assert "1[0-9]|20" in sql and ">= 50" in sql
          logo=Path('apps/flutter_client/lib/src/widgets/fitted_logo_catalog.dart').read_text()
          assert "static const count = 21" in logo
          print('Brand Studio schema/catalog integrity PASS')
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare Flutter Web
        working-directory: apps/flutter_client
        run: |
          flutter create --platforms=web . --project-name=my_fitness_date
          flutter pub get
      - name: Full Dart analysis
        working-directory: apps/flutter_client
        run: flutter analyze --no-fatal-infos
      - name: Full widget and theme regression
        working-directory: apps/flutter_client
        run: flutter test --reporter expanded
      - name: Build authenticated Flutter website
        working-directory: apps/flutter_client
        run: flutter build web --release --dart-define=MFD_V26_ENABLED=true
