name: Brand Admin — security and configuration contracts
# FinOps: manual-only; avoids unbudgeted PR/push jobs.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    name: Admin 2FA, RLS, uploads and route contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Admin security contract tests
        run: python3 scripts/test_brand_admin_static.py
      - name: JavaScript parser
        run: |
          node --check apps/flutter_client/cloudflare/admin/branding/admin-brand.js
          node --check apps/flutter_client/cloudflare/admin/branding/reset-password/reset-password.js
      - name: No unprotected admin UI asset
        run: |
          test -s apps/flutter_client/cloudflare/admin/branding/index.html
          test -s apps/flutter_client/cloudflare/admin/branding/admin-brand.css
          test -s apps/flutter_client/cloudflare/admin/branding/admin-brand.js
          test -s apps/flutter_client/cloudflare/admin/branding/reset-password/index.html
          test -s apps/flutter_client/cloudflare/admin/branding/reset-password/reset-password.js
          echo "Admin UI and deny-by-default migration contracts passed"
