name: CI MVP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/mfd-bundle
      - name: PostgreSQL Gym Shield integration tests
        run: |
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610260001_private_dating.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270002_dating_birthdate.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/private_dating_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/dating_birthdate_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/private_dating_edge_cases.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270003_social_community.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/social_community_integration.sql
