name: CI MVP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Candidate integration audit (does not authorize beta)
        run: npm run candidate:audit
      - name: Demo deployment preflight (no backend, no accounts)
        env:
          EXPO_PUBLIC_MFD_DEMO_BUILD: 'YES'
        run: npm run release:preflight:demo
      - name: Android JavaScript bundle
        run: npx expo export --platform android --output-dir /tmp/mfd-android-bundle
      - name: iOS JavaScript bundle
        run: npx expo export --platform ios --output-dir /tmp/mfd-ios-bundle
      - name: PostgreSQL Gym Shield integration tests
        run: |
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610260001_private_dating.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270002_dating_birthdate.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/private_dating_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/dating_birthdate_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/private_dating_edge_cases.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270003_social_community.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/social_community_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270004_trust_safety.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/trust_safety_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270005_admin_moderation.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/admin_moderation_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270006_appeals_notifications.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/appeals_notifications_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270007_account_privacy.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/account_privacy_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270008_operator_erasure_preflight.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/operator_erasure_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270009_erasure_claim_session_guard.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/erasure_claim_session_guard_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/mvp_e2e_v11.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270010_adult_eligibility_gymshield.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/adult_eligibility_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270011_incident_triage.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/incident_triage_integration.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/migrations/202610270012_privacy_retention.sql
          psql -h localhost -U postgres -d app_test -v ON_ERROR_STOP=1 -f supabase/tests/privacy_retention_integration.sql
