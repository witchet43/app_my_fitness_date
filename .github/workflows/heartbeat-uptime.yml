name: SaaS heartbeat monitor — jtrdvnwbxpfdnbzasvcj

# Scheduled events are executed by GitHub only from the default branch.
# Three small requests/day; monitor GitHub minutes and Supabase quota.
on:
  schedule:
    - cron: '11 2,10,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heartbeat-jtrdvnwbxpfdnbzasvcj
  cancel-in-progress: true

jobs:
  check-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exercise actual Supabase database through API
        run: |
          curl --fail-with-body --silent --show-error --location \
            --retry 2 --retry-delay 5 --retry-all-errors --max-time 12 \
            --header 'Cache-Control: no-cache' \
            'https://jtrdvnwbxpfdnbzasvcj.supabase.co/functions/v1/heartbeat' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok" and d.get("dependencies",{}).get("database")=="ok", "Database readiness failed"; print("Readiness ok")'
